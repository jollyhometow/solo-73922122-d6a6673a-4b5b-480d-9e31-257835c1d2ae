services:
  web1:
    build: .
    container_name: sales-web1
    environment:
      SALES_DB: /data/sales.db
      # 以下均为默认值，无需设置；仅调参时取消注释：
      # SALES_BUSY_TIMEOUT_MS: "30000"   # SQLite 原 30 秒忙等待（保持不变）
      # SALES_IMPORT_WORKERS: "2"        # 每进程导入专用执行器名额（与共享线程池隔离）
      # SALES_IMPORT_MAX_PENDING: "128"  # 每进程导入在途任务上限（超出返回可重试 503）
    volumes:
      - sales_data:/data
    ports:
      - "8081:8000"          # 直连进程 1，便于验证双进程
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web2:
    build: .
    container_name: sales-web2
    environment:
      SALES_DB: /data/sales.db
    volumes:
      - sales_data:/data
    ports:
      - "8082:8000"          # 直连进程 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: sales-nginx
    depends_on:
      - web1
      - web2
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"          # 浏览器统一入口（轮询两个 Web 进程）

volumes:
  sales_data:
